<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cara Mencuci Pakai Mesin</title>
<style>
  :root {
    --bg: #F4F7FB;
    --ink: #1E2A36;
    --muted: #5B6B7B;
    --accent: #2F6FED;
    --deterjen: #4BA3F5;
    --pewangi: #F28CB8;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #EAF1F7; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation;
           -webkit-tap-highlight-color: transparent; }

  /* Dialog yang melayang di atas grafis */
  .panel {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; padding: 18px 20px 20px;
    background: #FFFFFF;
    border-radius: 20px; box-shadow: 0 12px 40px rgba(30,42,54,.18);
  }
  @media (min-width: 900px) { .panel { left: 32px; right: auto; bottom: 32px; width: 400px; margin: 0; padding: 22px 24px 24px; } }
  .eyebrow { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .num { color: var(--accent); }
  .dots { display: flex; gap: 6px; margin: 10px 0 14px; }
  .dot { flex: 1; height: 5px; border-radius: 3px; background: #E1E8EF; transition: background .3s; }
  .dot.done { background: var(--accent); }
  .dot.now { background: #9DBBF7; }
  .panel h2 { margin: 0 0 8px; font-size: 22px; }
  .panel p { margin: 0; font-size: 17px; line-height: 1.5; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  #btnAuto { flex: none; font: inherit; font-weight: 700; font-size: 15px; border: 0; border-radius: 12px; padding: 0 14px;
             background: #EEF1F4; color: var(--ink); cursor: pointer; white-space: nowrap; }
  #btnAuto.on { background: var(--ink); color: #fff; }
  .finished .row { display: none; }
  .tap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px;
         background: #E7EEFD; color: var(--accent); font-weight: 700; font-size: 16px; }
  .tap::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
                 animation: blink 1.4s ease-out infinite; }
  @keyframes blink { 0% { box-shadow: 0 0 0 0 rgba(47,111,237,.6); } 100% { box-shadow: 0 0 0 10px rgba(47,111,237,0); } }
  .tap.wait { background: #EEF1F4; color: var(--muted); }
  .tap.wait::before { background: #B8C4CF; animation: none; }
  .tap.nudge { animation: nudge .45s; }
  @keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #btnAgain { display: none; margin-top: 14px; width: 100%; font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 12px;
              padding: 13px; background: var(--accent); color: #fff; cursor: pointer; }
  .finished #btnAgain { display: block; }
  @media (max-width: 600px) {
    .panel { padding: 14px 16px 16px; border-radius: 18px; }
    .panel h2 { font-size: 20px; }
    .panel p { font-size: 16px; }
  }

  /* ---------- Scene ---------- */
  .hot { fill: rgba(47,111,237,.12); stroke: var(--accent); stroke-width: 3; opacity: 0; pointer-events: none; cursor: pointer; transform-box: fill-box; transform-origin: center; }
  #scene.at1:not(.d1) #hot1, #scene.at2:not(.d2) #hot2, #scene.at3:not(.d3) #hot3,
  #scene.at4:not(.d4) #hot4, #scene.at5:not(.d5) #hot5, #scene.at6:not(.d6) #hot6,
  #scene.at7:not(.d7) #hot7, #scene.at8:not(.d8) #hot8, #scene.at9:not(.d9) #hot9,
  #scene.at10:not(.d10) #hot10, #scene.at11:not(.d11) #hot11, #scene.at12:not(.d12) #hot12 {
    opacity: 1; pointer-events: all; animation: pulse 1.4s ease-out infinite;
  }
  @keyframes pulse { 0% { transform: scale(.85); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }

  /* 1. Keran */
  /* Keran tampak depan: tuas lurus ke bawah diputar ke kanan */
  .lever { transform-box: view-box; transform-origin: 250px 92px; transition: transform .9s cubic-bezier(.45,1.3,.5,1); }
  #scene.d1 .lever { transform: rotate(-90deg); }
  .turn-hint { opacity: 0; transition: opacity .3s; }
  #scene.at1:not(.d1) .turn-hint { opacity: 1; }
  .hose-water { opacity: 0; transition: opacity .4s; stroke-dasharray: 8 10; animation: flow .6s linear infinite; }
  #scene.d1 .hose-water { opacity: 1; }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  .drip { opacity: 0; }
  #scene.d1:not(.d9) .drip { animation: drip 1s ease-in infinite; }
  @keyframes drip { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(14px); } }

  /* 2. Pakaian & pintu: pintu terbuka (terlipat ke engsel kiri), pakaian jatuh masuk, pintu menutup */
  .door { transform-box: view-box; transform-origin: 397px 300px; transform: scaleX(.14); transition: transform .7s ease-in-out; }
  #scene.d2 .door { transform: none; transition-delay: .9s; }
  .clothes-in { transform: translateY(-110px); opacity: 0; transition: transform .8s cubic-bezier(.5,0,.6,1.3), opacity .3s; }
  #scene.d2 .clothes-in { transform: none; opacity: 1; }

  /* Layar menyala saat kenop diputar (mesin tanpa tombol on/off) */
  .screen { transition: fill .4s; }
  #scene.d7 .screen { fill: #1B2631; }

  /* 3-4. Laci */
  .inset { opacity: 0; transform: translateY(10px); transition: opacity .4s, transform .4s; pointer-events: none; }
  #scene.at4 .inset, #scene.at5 .inset { opacity: 1; transform: none; pointer-events: all; }
  .drawer { transition: stroke .3s, fill .3s; }
  #scene.at3 .drawer, #scene.at4 .drawer, #scene.at5 .drawer, #scene.at6 .drawer { stroke: var(--accent); fill: #E7EEFD; }
  /* Laci tertarik keluar setelah diketuk (langkah 3), didorong masuk lagi (langkah 6) */
  .drawer-g { transform-box: view-box; transform-origin: 392px 160px; transition: transform .5s ease-out; }
  #scene.d3:not(.d6) .drawer-g { transform: translateY(7px) scale(1.06); }
  .bottle { opacity: 0; transition: opacity .3s; }
  #scene.at4 .bottle-det, #scene.at5 .bottle-pew { opacity: 1; }
  .tilt { transform-box: view-box; transition: transform .45s ease-in-out; }
  .bottle-det .tilt { transform-origin: 98px 247px; }
  .bottle-pew .tilt { transform-origin: 191px 247px; }
  #scene.pour .tilt { transform: rotate(-135deg); }
  .stream { transform-box: fill-box; transform-origin: top; transform: scaleY(0); transition: transform .3s; }
  #scene.pour .stream { transform: scaleY(1); transition-delay: .4s; }
  .fill { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); transition: transform 1.1s ease-out .5s; }
  #scene.d4 .fill-det, #scene.d5 .fill-pew { transform: scaleY(1); }

  /* 5. Kenop */
  .knob { transform-box: view-box; transform-origin: 500px 132px; transition: transform 1s cubic-bezier(.4,1.4,.5,1); }
  #scene.d7 .knob { transform: rotate(-90deg); }
  .prog { transition: fill .3s, font-weight .3s; }
  #scene.d7 .prog-mix { fill: var(--accent); font-weight: 700; }
  /* 11. Matikan mesin: kenop kembali ke atas (Off), layar mati */
  #scene.d11 .knob { transform: none; }
  #scene.d11 .prog-mix { fill: #5B6B7B; font-weight: 400; }
  #scene.d11 .screen { fill: #3A4652; }

  /* 7. Start */
  .startbtn { transition: fill .3s; }
  #scene.washing .startbtn { fill: #22B07D; }
  .water { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); transition: transform 2.5s ease-out; }
  #scene.washing .water { transform: scaleY(1); }
  .clothes { transform-box: view-box; transform-origin: 495px 300px; }
  #scene.washing .clothes { animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bubble { opacity: 0; }
  #scene.washing .bubble { animation: rise 2s ease-in infinite; }
  #scene.washing .bubble:nth-of-type(2) { animation-delay: .6s; }
  #scene.washing .bubble:nth-of-type(3) { animation-delay: 1.2s; }

  /* 10. Keluarkan pakaian */
  #scene.d10 .door { transform: scaleX(.14); transition-delay: 0s; }
  #scene.d10 .clothes-in { opacity: 0; transform: translateX(-40px); transition-delay: .6s; }
  .basket { opacity: 0; transition: opacity .4s; }
  #scene.at10 .basket, #scene.at11 .basket, #scene.at12 .basket, #scene.at13 .basket { opacity: 1; }
  .basket-clothes { opacity: 0; transform: translateY(-30px); transition: opacity .4s, transform .5s; }
  #scene.d10 .basket-clothes { opacity: 1; transform: none; transition-delay: 1s; }

  /* 11. Tutup keran */
  #scene.d12 .lever { transform: none; }
  #scene.d12 .hose-water { opacity: 0; }
  .turn-back { opacity: 0; transition: opacity .3s; }
  #scene.at12:not(.d12) .turn-back { opacity: 1; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-50px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

          <rect class="stream" x="167" y="270" width="5" height="70" rx="2" fill="#F28CB8"/>
          <g class="tilt">
            <rect x="173" y="222" width="36" height="50" rx="8" fill="#F28CB8"/>
            <rect x="184" y="210" width="14" height="13" rx="3" fill="#D9659A"/>
            <text x="191" y="252" text-anchor="middle" font-size="14" fill="#fff">✿</text>
          </g>
        </g>
      </g>
    </svg>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="eyebrow"><span>Cara Mencuci Pakai Mesin</span><span class="num" id="num"></span></div>
    <div class="dots" id="dots"></div>
    <h2 id="title"></h2>
    <p id="desc"></p>
    <div class="row">
      <div class="tap" id="tap"></div>
      <button id="btnAuto">Putar otomatis</button>
    </div>
    <button id="btnAgain">Ulangi dari awal</button>
  </aside>

<script>
const steps = [
  { title: 'Buka keran',          desc: 'Putar tuas merah dari bawah ke kanan.',                       tap: 'Ketuk tuas merah' },
  { title: 'Masukkan pakaian',    desc: 'Masukkan pakaian, lalu tutup pintu.',                         tap: 'Ketuk pintu mesin' },
  { title: 'Tarik laci',          desc: 'Tarik laci di kiri atas mesin.',                              tap: 'Ketuk laci' },
  { title: 'Tuang deterjen',      desc: 'Ke kotak kiri (tanda II). Jangan lewat garis MAX.',           tap: 'Ketuk kotak kiri' },
  { title: 'Tuang pewangi',       desc: 'Ke kotak tengah (gambar bunga). Kotak kanan biarkan kosong.', tap: 'Ketuk kotak tengah' },
  { title: 'Dorong laci',         desc: 'Dorong laci sampai tertutup.',                                tap: 'Ketuk laci' },
  { title: 'Pilih Mix',           desc: 'Putar tombol bulat ke kiri sampai menunjuk Mix.',             tap: 'Ketuk tombol bulat' },
  { title: 'Atur suhu',           desc: 'Tekan Suhu sampai layar menunjukkan -- (air dingin).',        tap: 'Ketuk tombol Suhu' },
  { title: 'Mulai',               desc: 'Tekan tombol biru, lalu tunggu sampai mesin berhenti.',       tap: 'Ketuk tombol biru', busy: 'Mesin sedang mencuci…' },
  { title: 'Keluarkan pakaian',   desc: 'Layar menunjukkan End. Buka pintu dan keluarkan pakaian.',    tap: 'Ketuk pintu mesin' },
  { title: 'Matikan mesin',       desc: 'Putar tombol bulat kembali ke atas (Off).',                   tap: 'Ketuk tombol bulat' },
  { title: 'Tutup keran',         desc: 'Putar tuas merah kembali ke bawah.',                          tap: 'Ketuk tuas merah' },
];

const scene = document.getElementById('scene');
const $ = id => document.getElementById(id);
const dispProg = $('dispProg'), dispMain = $('dispMain');
let cur = 0;      // langkah yang sedang dibuka (0..11), 12 = selesai
let done = 0;     // jumlah langkah yang sudah dilakukan (otomatis lanjut setelah animasi)
let busy = false;
let auto = false;   // putar otomatis

// Kamera: zoom ke area yang relevan tiap langkah supaya teks kecil tetap terbaca (terutama di HP)
// Tiap langkah: [bingkai untuk layar lebar, bingkai untuk layar tegak/HP]
const FULL = [[0, 0, 760, 520], [125, 60, 545, 400]];
const cams = [
  [[100, 20, 380, 260], [175, 35, 190, 210]],   // keran
  [[290, 180, 410, 281], [385, 185, 220, 230]],  // pintu
  [[320, 60, 360, 240], [335, 85, 215, 150]],   // tarik laci
  [[10, 105, 460, 315], [15, 165, 300, 260]],   // laci
  [[10, 105, 460, 315], [15, 165, 300, 260]],
  [[320, 60, 360, 240], [335, 85, 215, 150]],   // dorong laci
  [[400, 60, 270, 185], [440, 85, 215, 100]],   // kenop & layar
  [[400, 60, 270, 185], [440, 85, 215, 100]],
  [[250, 70, 480, 330], [385, 90, 270, 320]],   // start & pintu
  [[120, 170, 520, 280], [130, 190, 480, 260]],  // keluarkan pakaian
  [[400, 60, 270, 185], [440, 85, 215, 100]],    // matikan mesin
  [[100, 20, 380, 260], [175, 35, 190, 210]],    // tutup keran
];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const panel = $('panel');
// Hitung viewBox supaya kotak `box` pas di area layar yang tidak tertutup dialog
function frameFor(box) {
  const W = innerWidth, H = innerHeight, pr = panel.getBoundingClientRect(), pad = 16;
  let fl, ft, fw, fh;
  if (W >= 900) { fl = pr.right + pad; ft = pad; fw = W - fl - pad; fh = H - 2 * pad; }
  else { fl = pad; ft = pad; fw = W - 2 * pad; fh = pr.top - 2 * pad; }
  fw = Math.max(fw, 120); fh = Math.max(fh, 120);
  const [x, y, w, h] = box[fw / fh < 1 ? 1 : 0], k = Math.min(fw / w, fh / h);
  return [x + w / 2 - (fl + fw / 2) / k, y + h / 2 - (ft + fh / 2) / k, W / k, H / k];
}
let camBox = FULL, vb = frameFor(FULL), camAnim = null, animating = false;
scene.setAttribute('viewBox', vb.join(' '));
// Gerak kamera dengan menganimasikan viewBox. Tujuan dihitung sekali per perpindahan (tanpa baca layout tiap frame).
function camTo(box, instant) {
  if (box === camBox && !instant) return;
  camBox = box;
  cancelAnimationFrame(camAnim);
  const from = vb.slice(), to = frameFor(box);
  if (instant || reduceMotion) { vb = to; scene.setAttribute('viewBox', vb.join(' ')); animating = false; return; }
  const t0 = performance.now(), dur = 800;
  animating = true;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    vb = from.map((v, i) => v + (to[i] - v) * e);
    scene.setAttribute('viewBox', vb.join(' '));
    if (p < 1) camAnim = requestAnimationFrame(step); else animating = false;
  };
  camAnim = requestAnimationFrame(step);
}

const wait = ms => new Promise(r => setTimeout(r, ms));

$('dots').innerHTML = steps.map(() => '<div class="dot"></div>').join('');

function render() {
  const cls = ['at' + (cur + 1)];
  for (let i = 1; i <= done; i++) cls.push('d' + i);
  for (const c of ['pour', 'washing']) if (scene.classList.contains(c)) cls.push(c);
  scene.setAttribute('class', cls.join(' '));

  document.querySelectorAll('.dot').forEach((d, i) => {
    d.className = 'dot' + (i < done ? ' done' : i === cur ? ' now' : '');
  });

  const finished = cur >= steps.length;
  panel.classList.toggle('finished', finished);
  if (finished) {
    $('num').textContent = 'Selesai';
    $('title').textContent = 'Cucian siap dijemur';
    $('desc').textContent = 'Semua langkah sudah selesai.';
  } else {
    const s = steps[cur];
    $('num').textContent = `Langkah ${cur + 1} dari ${steps.length}`;
    $('title').textContent = s.title;
    $('desc').textContent = s.desc;
    $('tap').textContent = busy ? (s.busy || 'Tunggu sebentar…') : s.tap;
    $('tap').classList.toggle('wait', busy);
  }
  camTo(cams[cur] || FULL);   // setelah teks diganti, supaya tinggi dialog sudah benar

  $('btnAuto').textContent = auto ? 'Berhenti' : 'Putar otomatis';
  $('btnAuto').classList.toggle('on', auto);
  if (!busy) updateDisplay();
}

function updateDisplay() {
  const on = done >= 7 && done < 11;   // layar menyala dari Mix sampai kenop kembali ke Off
  dispProg.textContent = on ? 'MIX' : '';
  dispMain.textContent = !on ? '' : done < 8 ? '40°' : done < 9 ? '--' : 'End';
}

async function act() {
  if (busy || cur >= steps.length) return;
  busy = true; render();
  const n = cur + 1;

  if (n === 2) {
    done = n; render();
    await wait(1700);
  } else if (n === 4 || n === 5) {
    scene.classList.add('pour');
    done = n; render();
    await wait(1700);
    scene.classList.remove('pour');
    await wait(400);
  } else if (n === 8) {
    for (const t of ['60°', '20°', '--']) { await wait(450); dispMain.textContent = t; }
    done = n;
  } else if (n === 9) {
    done = n; scene.classList.add('washing'); render();
    dispProg.textContent = 'MIX  --';
    for (let m = 85; m >= 0; m -= 5) { dispMain.textContent = `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; await wait(300); }
    dispMain.textContent = 'End';
    scene.classList.remove('washing'); render();
    await wait(1800);
  } else if (n === 10) {
    done = n; render();
    await wait(2000);
  } else {
    done = n; render();
    updateDisplay();
    await wait(1000);
  }
  await wait(500);
  busy = false; cur++; render();
}

function reset() { if (busy) return; auto = false; cur = 0; done = 0; render(); }

async function autoplay() {
  auto = !auto; render();
  while (auto && cur < steps.length) {
    if (!busy) { await wait(1200); if (!auto) break; await act(); }
    else await wait(200);
  }
  auto = false; render();
}
$('btnAuto').onclick = autoplay;

document.querySelectorAll('.hot').forEach(h => h.addEventListener('click', e => { e.stopPropagation(); act(); }));
// Ketukan di tempat lain: goyangkan petunjuk supaya jelas apa yang harus diketuk
scene.addEventListener('click', () => {
  const t = $('tap'); t.classList.remove('nudge'); void t.offsetWidth; t.classList.add('nudge');
});
$('btnAgain').onclick = reset;
document.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); cur >= steps.length ? reset() : act(); } });
const refit = () => { if (!animating) camTo(camBox, true); };
addEventListener('resize', refit);
new ResizeObserver(refit).observe(panel);

render();
</script>
</body>
</html>
